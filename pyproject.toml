[project]
name = "ansimcare"
version = "0.1.0"
description = "독거노인 AI 친구 전화 (안심케어) — 팀 공명"
requires-python = ">=3.11"
# VadSegmenter가 numpy를 쓰는데 선언이 빠져 있었다. 새로 받은 사람은 실행이 안 된다.
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # /v1/voiceml, /v1/stream-ended가 Form()으로 받는다. urlencoded도 이걸 요구한다.
    "python-multipart>=0.0.9",
    # app/telephony/client.py와 app/media/clova_voice.py가 모듈 최상단에서
    # import한다. dev 그룹에만 있으면 `pip install .` 뒤 uvicorn이 뜨자마자
    # ImportError로 죽는다 — 배포 당일에 발견하기 딱 좋은 자리였다.
    "httpx>=0.27",
    # DATABASE_URL이 있을 때만 실제로 쓰지만 런타임 의존성이다. dev 그룹에
    # 두면 배포한 서버가 DB에 붙는 순간 ImportError로 죽는다 — httpx와 boto3를
    # 같은 이유로 여기 올렸다.
    #
    # [binary]는 미리 빌드된 libpq를 들고 온다. 없으면 서버에 pg_config와
    # 빌드 도구가 있어야 하는데, EC2를 새로 띄울 때마다 그걸 챙기게 된다.
    "psycopg[binary]>=3.2",
    # 연결을 매번 새로 열면 통화 한 통에 수십 번 handshake를 한다.
    "psycopg_pool>=3.2",
    # app/media/polly_voice.py가 쓴다. 지금은 개발용 TTS 때문이지만 녹음을
    # S3에 올릴 때도 필요하다. httpx처럼 dev 그룹에만 두면 배포 당일에
    # ImportError로 발견하게 된다.
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
